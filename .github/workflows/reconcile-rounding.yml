name: Read-only rounding reconciliation
on:
  workflow_dispatch:
    inputs:
      complete_partial_exit:
        description: Authorize the live executor to finish the verified unfilled exit leg at its original limit or better
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: sig-portfolio-execution
  cancel-in-progress: false
jobs:
  reconcile:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Validate recovery safeguards
        run: python -m unittest discover -s tests -v
      - name: Verify closed fills and recover checkpoint without trading
        env:
          SIG_API_KEY: ${{ secrets.SIG_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          SIG_AUTHORIZE_EXIT_RECOVERY: ${{ inputs.complete_partial_exit }}
        run: python reconcile_only.py

