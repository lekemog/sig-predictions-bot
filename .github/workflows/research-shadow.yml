name: Read-only strategy research
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sig-portfolio-execution
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Validate execution and research
        run: |
          python -m unittest discover -s tests -v
          python -m unittest test_market_brain -v
      - name: GET-only catalogue and bounded depth research
        env:
          SIG_API_KEY: ${{ secrets.SIG_API_KEY }}
        run: |
          umask 077
          mkdir -p private
          python research_runner.py --collect --database private/brain.sqlite > private/result.json
      - name: Preserve actual research observations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: read-only-research-${{ github.run_id }}
          path: private/
          retention-days: 7
          if-no-files-found: ignore
