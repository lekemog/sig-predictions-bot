name: Strategy research validation
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Existing execution regression tests
        run: python -m unittest discover -s tests -v
      - name: Coordinated research regression tests
        run: python -m unittest test_market_brain -v
